name: Passo
options:
  bundleIdPrefix: com.passo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"         # iPhone only
    INFOPLIST_FILE: Passo/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.passo.app
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES

targets:
  Passo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Passo
        excludes:
          - "**/*.md"
    info:
      path: Passo/Info.plist
      properties:
        CFBundleName: Passo
        CFBundleDisplayName: Passo
        CFBundleShortVersionString: "1.0.0" # x-release-please-version
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "扫描票据条码和二维码"
        NSPhotoLibraryUsageDescription: "从相册导入票据截图"
        NSLocationWhenInUseUsageDescription: "在你到达场馆时发送票据提醒"
        NSLocationAlwaysAndWhenInUseUsageDescription: "在后台检测你是否到达场馆，并在适当时间发送票据提醒"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - passo
            CFBundleURLName: com.passo.app
        NSUbiquitousContainers:
          iCloud.com.passo.app:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: Passo
            NSUbiquitousContainerSupportedFolderLevels: None
    entitlements:
      path: Passo/Passo.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.passo.app
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.passo.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.passo.app

    settings:
      base:
        INFOPLIST_FILE: Passo/Info.plist

  PassoShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PassoShareExtension
    info:
      path: PassoShareExtension/Info.plist
      properties:
        CFBundleName: PassoShareExtension
        CFBundleDisplayName: Passo
        CFBundleShortVersionString: "1.0.0" # x-release-please-version
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    entitlements:
      path: PassoShareExtension/PassoShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.passo.app
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.passo.app.share
        INFOPLIST_FILE: PassoShareExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  # NOTE: the live Passo.xcodeproj is currently hand/Xcode-maintained and has
  # diverged from this file (it already contains PassoUITests, which was added
  # directly to the pbxproj). Both test targets are declared here so a future
  # `xcodegen generate` reproduces the full project. Verify the regenerated
  # project before committing — see plan.md 批次 3 / P3-1.
  PassoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PassoTests
    dependencies:
      - target: Passo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passo.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Passo.app/Passo"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal

  PassoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PassoUITests
    dependencies:
      - target: Passo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passo.app.uitests
        TEST_TARGET_NAME: Passo
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  Passo:
    build:
      targets:
        Passo: all
    test:
      targets:
        - PassoTests
        - PassoUITests
